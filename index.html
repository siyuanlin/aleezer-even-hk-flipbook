
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe4ce" />
    <title>Aleezer & Even | Hong Kong Sketchbook</title>
    <style>
      :root {
        --paper: #f1e5cf;
        --sheet: #fff8e9;
        --ink: #162033;
        --muted: #786f61;
        --blue: #284268;
        --red: #9b3d48;
        --sage: #8fa184;
        --tea: #c8a777;
        --water: #afcdd0;
        --shadow: 0 18px 42px rgba(61, 45, 28, 0.18);
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        color: var(--ink);
        font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background:
          radial-gradient(circle at 18% 0%, rgba(255,255,255,.8), transparent 20rem),
          radial-gradient(circle at 86% 8%, rgba(143,161,132,.22), transparent 22rem),
          linear-gradient(180deg, #f6eddd, #e8d9bf);
      }

      button,
      textarea { font: inherit; }

      button {
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .shell {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(14px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
      }

      .book {
        width: min(980px, 100%);
        height: min(760px, calc(100svh - 28px));
        min-height: 640px;
        display: grid;
        grid-template-rows: 58px minmax(0, 1fr) 62px;
        overflow: hidden;
        border: 3px solid var(--ink);
        border-radius: 28px;
        background:
          linear-gradient(90deg, rgba(22,32,51,.04) 1px, transparent 1px),
          linear-gradient(0deg, rgba(22,32,51,.035) 1px, transparent 1px),
          var(--paper);
        background-size: 28px 28px;
        box-shadow: var(--shadow);
      }

      .topbar {
        display: grid;
        grid-template-columns: 70px 1fr 44px 44px;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-bottom: 3px solid var(--ink);
        background: #fbf3e5;
      }

      .traffic {
        display: flex;
        gap: 8px;
      }

      .traffic i {
        width: 14px;
        height: 14px;
        border: 2px solid #c8bdab;
        border-radius: 50%;
        background: #fff8e9;
      }

      .crumb {
        min-width: 0;
        height: 38px;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        padding: 0 14px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--sheet);
        white-space: nowrap;
      }

      .crumb span {
        color: var(--red);
        font-size: 12px;
        font-weight: 900;
      }

      .crumb b {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 13px;
      }

      .round-btn {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--sheet);
        font-weight: 900;
      }

      .round-btn.playing {
        color: #fff8e9;
        background: var(--blue);
      }

      .stage {
        min-height: 0;
        position: relative;
        overflow: hidden;
      }

      .slide {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 12px;
        padding: 18px 22px 14px;
        opacity: 0;
        transform: translateX(36px);
        pointer-events: none;
        transition: opacity .28s ease, transform .34s ease;
      }

      .slide.active {
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
      }

      h1,
      h2 {
        margin: 0;
        text-align: center;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-size: clamp(30px, 4.2vw, 50px);
        line-height: 1.02;
        letter-spacing: 0;
        text-shadow: 1px 1px 0 rgba(200,167,119,.35);
      }

      .art-card {
        min-height: 0;
        position: relative;
        overflow: hidden;
        border: 3px solid var(--ink);
        border-radius: 14px 10px 16px 11px;
        background:
          radial-gradient(circle at 18% 16%, rgba(255,255,255,.65), transparent 13rem),
          repeating-linear-gradient(118deg, rgba(22,32,51,.035) 0 1px, transparent 1px 9px),
          var(--sheet);
      }

      .art-card::after {
        content: "Aleezer & Even · HK Field Sketch";
        position: absolute;
        right: 12px;
        bottom: 10px;
        padding: 5px 9px;
        border: 2px solid rgba(155,61,72,.72);
        border-radius: 999px;
        color: rgba(155,61,72,.82);
        background: rgba(255,248,233,.72);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 11px;
        font-weight: 800;
        transform: rotate(-3deg);
        pointer-events: none;
      }

      svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      svg * {
        vector-effect: non-scaling-stroke;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .wash-blue { fill: var(--water); }
      .wash-sage { fill: #c7d3bd; }
      .wash-tea { fill: #d8c09a; }
      .wash-red { fill: #b76569; }
      .wash-cream { fill: #f6ecd7; }
      .wash-dark { fill: var(--blue); }
      .line { stroke: var(--ink); stroke-width: 3; fill: none; }
      .thin { stroke: var(--ink); stroke-width: 1.4; fill: none; opacity: .72; }
      .hatch { stroke: var(--ink); stroke-width: 1; fill: none; opacity: .28; }
      .white-line { stroke: #fff8e9; stroke-width: 8; fill: none; opacity: .65; }

      .pin {
        position: absolute;
        width: 34px;
        height: 34px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        color: #fff8e9;
        background: var(--red);
        box-shadow: 3px 3px 0 rgba(22,32,51,.18);
        font-weight: 900;
        touch-action: manipulation;
      }

      .pin[data-pin="1"] { left: 16%; top: 28%; }
      .pin[data-pin="2"] { right: 17%; top: 25%; }
      .pin[data-pin="3"] { left: 45%; bottom: 17%; }

      .note-strip {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        min-height: 56px;
        padding: 10px 14px;
        border: 2px solid var(--ink);
        border-radius: 12px;
        background: rgba(255,248,233,.78);
      }

      .note-strip p {
        margin: 0;
        color: #3a342b;
        font-size: 14px;
        line-height: 1.45;
      }

      .stamp-btn {
        min-height: 38px;
        padding: 0 13px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        color: #fff8e9;
        background: var(--blue);
        font-size: 13px;
        font-weight: 900;
        white-space: nowrap;
      }

      .bottom {
        display: grid;
        grid-template-columns: 48px 1fr 48px;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        border-top: 3px solid var(--ink);
        background: #fbf3e5;
      }

      .nav-btn {
        width: 42px;
        height: 42px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--sheet);
        font-size: 25px;
        font-weight: 900;
      }

      .nav-btn:disabled {
        opacity: .38;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
      }

      .tab {
        min-width: 0;
        min-height: 38px;
        padding: 0 8px;
        overflow: hidden;
        border: 2px solid rgba(22,32,51,.28);
        border-radius: 999px;
        background: rgba(255,248,233,.7);
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 900;
      }

      .tab.active {
        color: #fff8e9;
        border-color: var(--ink);
        background: var(--blue);
      }

      dialog {
        width: min(390px, calc(100% - 30px));
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 0;
        color: var(--ink);
        background: var(--sheet);
        box-shadow: 9px 9px 0 rgba(22,32,51,.16);
      }

      dialog::backdrop {
        background: rgba(39, 34, 28, .36);
        backdrop-filter: blur(3px);
      }

      dialog form {
        position: relative;
        padding: 22px;
      }

      dialog h3 {
        margin: 0 38px 10px 0;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-size: 24px;
      }

      dialog p {
        margin: 0;
        color: #3b352f;
        line-height: 1.65;
      }

      .close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 32px;
        height: 32px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--sheet);
      }

      textarea {
        width: 100%;
        min-height: 112px;
        resize: none;
        border: 2px solid var(--ink);
        border-radius: 12px;
        padding: 12px;
        background: #fffdf6;
        outline: none;
      }

      .save {
        width: 100%;
        min-height: 42px;
        margin-top: 10px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        color: #fff8e9;
        background: var(--blue);
        font-weight: 900;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 30;
        max-width: calc(100vw - 32px);
        padding: 10px 14px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--sheet);
        font-weight: 900;
        opacity: 0;
        transform: translate(-50%, 12px);
        pointer-events: none;
        transition: .2s ease;
        white-space: nowrap;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 760px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }

        .shell {
          min-height: 100svh;
          height: 100svh;
          padding: 0;
          overflow: hidden;
        }

        .book {
          width: 100%;
          height: 100svh;
          min-height: 0;
          border: 0;
          border-radius: 0;
          grid-template-rows: 54px minmax(0, 1fr) 58px;
        }

        .topbar {
          grid-template-columns: 26px 1fr 38px 38px;
          gap: 7px;
          padding: 7px 8px;
        }

        .traffic { gap: 4px; }

        .traffic i {
          width: 7px;
          height: 7px;
          border-width: 1.5px;
        }

        .crumb {
          height: 38px;
          padding: 0 10px;
        }

        .crumb span { display: none; }
        .crumb b { font-size: 12px; }

        .round-btn {
          width: 38px;
          height: 38px;
        }

        .slide {
          padding: 10px 8px 10px;
          gap: 8px;
        }

        h1,
        h2 {
          font-size: clamp(24px, 7.3vw, 34px);
        }

        .art-card {
          border-width: 2px;
          border-radius: 10px;
        }

        .art-card::after {
          right: 8px;
          bottom: 7px;
          max-width: 48vw;
          padding: 4px 7px;
          font-size: 9px;
        }

        .pin {
          width: 30px;
          height: 30px;
          font-size: 12px;
        }

        .note-strip {
          min-height: 54px;
          padding: 8px 10px;
          gap: 8px;
        }

        .note-strip p {
          font-size: 12px;
        }

        .stamp-btn {
          min-height: 34px;
          padding: 0 10px;
          font-size: 11px;
        }

        .bottom {
          grid-template-columns: 40px 1fr 40px;
          gap: 7px;
          padding: 7px 8px;
        }

        .nav-btn {
          width: 38px;
          height: 38px;
        }

        .tabs { gap: 4px; }

        .tab {
          min-height: 34px;
          padding: 0 4px;
          font-size: 10px;
        }
      }

      @media (max-height: 690px) and (max-width: 760px) {
        .book {
          grid-template-rows: 50px minmax(0, 1fr) 52px;
        }

        .slide {
          gap: 5px;
          padding-block: 7px;
        }

        h1,
        h2 {
          font-size: clamp(21px, 6.2vw, 29px);
        }

        .note-strip {
          min-height: 44px;
        }

        .note-strip p {
          line-height: 1.25;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="book" aria-label="Aleezer 和 Even 的香港英伦手绘情侣空间">
        <header class="topbar">
          <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="crumb"><span>Field sketch</span><b id="crumbText">Art Basel Hong Kong</b></div>
          <button class="round-btn" id="musicBtn" type="button" aria-label="播放音乐">♪</button>
          <button class="round-btn" id="wishBtn" type="button" aria-label="写便签">⇧</button>
        </header>

        <section class="stage" id="stage">

              </svg>
              <button class="pin" data-pin="1" data-note="银色悬浮装置被处理成柔和水彩金属体，保留展厅中央记忆点。">1</button>
              <button class="pin" data-pin="2" data-note="天花网格和灯架像英国建筑速写中的结构线，画面更安静。">2</button>
              <button class="pin" data-pin="3" data-note="Aleezer & Even 可以在这里选一件最像今晚心情的作品。">3</button>
            </div>
            <div class="note-strip"><p>英伦旅行手帐式展览页：水彩展厅、克制标注、留白更足。</p><button class="stamp-btn" data-stamp="art">盖章</button></div>
          </article>

              <button class="pin" data-pin="3" data-note="可以记录你们最想一起入手的限定单品。">3</button>
            </div>
            <div class="note-strip"><p>英伦街头插画式 ComplexCon：粗字、展墙、人物和透视地面被重新整理。</p><button class="stamp-btn" data-stamp="complexcon">盖章</button></div>
          </article>

          <article class="slide" data-title="Sushi Shikon" data-key="shikon">
            <h2>Sushi Shikon</h2>
            <div class="art-card">
              <svg viewBox="0 0 900 560" role="img" aria-label="香港志魂餐厅英伦手绘风格插画">
                <rect width="900" height="560" fill="#f7eedb" />
                <path d="M0 0H900V158H0Z" fill="#c8a777" stroke="#162033" stroke-width="3" />
                <g class="thin">
                  <path d="M0 42H900M0 88H900" />

                  <path d="M46 24c84 18 170 14 260-6M394 24c116 20 236 16 360-8M88 118c96 14 208 10 336-8M512 118c86 14 180 10 280-6" />

                <path d="M138 378L512 214L736 258L354 470Z" fill="#c99d63" stroke="#162033" stroke-width="5" />
                <path d="M210 318L496 210L624 238L318 382Z" fill="#dfbd82" stroke="#162033" stroke-width="4" />
                <path d="M366 398L736 252L824 278L456 482Z" fill="#b98b5d" stroke="#162033" stroke-width="4" />

      <dialog id="noteDialog">
        <form method="dialog">
          <button class="close" type="submit" aria-label="关闭">×</button>

      <dialog id="wishDialog">
        <form method="dialog">
          <button class="close" type="submit" aria-label="关闭">×</button>
          <h3>Aleezer & Even</h3>
          <textarea id="wishText" maxlength="96" placeholder="写一句想留在这页的话"></textarea>
          <button class="save" id="saveWish" type="button">Pin this note</button>
          <p id="savedWish"></p>
        </form>
      </dialog>

      <div class="toast" id="toast" role="status"></div>
    </main>

    <script>
      const slides = Array.from(document.querySelectorAll(".slide"));
      const tabs = document.querySelector("#tabs");
      const prevBtn = document.querySelector("#prevBtn");
      const nextBtn = document.querySelector("#nextBtn");
      const crumbText = document.querySelector("#crumbText");
      const noteDialog = document.querySelector("#noteDialog");
      const noteTitle = document.querySelector("#noteTitle");
      const noteText = document.querySelector("#noteText");
      const wishDialog = document.querySelector("#wishDialog");
      const wishBtn = document.querySelector("#wishBtn");
      const wishText = document.querySelector("#wishText");
      const saveWish = document.querySelector("#saveWish");
      const savedWish = document.querySelector("#savedWish");
      const musicBtn = document.querySelector("#musicBtn");
      const toast = document.querySelector("#toast");
      const stage = document.querySelector("#stage");

      const labels = ["Art Basel", "ComplexCon", "Shikon", "Cristal"];
      const validStamps = new Set(["art", "complexcon", "shikon", "cristal"]);
      const collected = new Set(JSON.parse(localStorage.getItem("ae-sketch-stamps") || "[]").filter((stamp) => validStamps.has(stamp)));
      const wishes = JSON.parse(localStorage.getItem("ae-sketch-wishes") || "{}");
      let current = 0;
      let startX = 0;
      let startY = 0;
      let startedOnButton = false;
      let audio = null;
      let musicOn = false;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove("show"), 1500);
      }

      function renderTabs() {
        tabs.innerHTML = "";
        labels.forEach((label, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "tab";
          button.textContent = label;
          button.addEventListener("click", () => goTo(index));
          tabs.appendChild(button);
        });
      }

      function sync() {
        slides.forEach((slide, index) => slide.classList.toggle("active", index === current));
        tabs.querySelectorAll(".tab").forEach((tab, index) => tab.classList.toggle("active", index === current));
        crumbText.textContent = slides[current].dataset.title;
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === slides.length - 1;
        const saved = wishes[String(current)] || "";
        wishText.value = saved;
        savedWish.textContent = saved ? `Pinned: ${saved}` : "";
      }

      function goTo(index) {
        current = Math.max(0, Math.min(index, slides.length - 1));
        sync();
      }

      function saveStamps() {
        localStorage.setItem("ae-sketch-stamps", JSON.stringify(Array.from(collected)));
      }

      function createAmbience() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        const ctx = new AudioContext();
        const master = ctx.createGain();
        const delay = ctx.createDelay();
        const feedback = ctx.createGain();
        master.gain.value = 0.42;
        delay.delayTime.value = 0.18;
        feedback.gain.value = 0.18;
        delay.connect(feedback).connect(delay);
        master.connect(delay).connect(ctx.destination);
        master.connect(ctx.destination);
        let timer;
        let bar = 0;
        const chords = [
          [261.63, 329.63, 392.0, 493.88],
          [293.66, 349.23, 440.0, 523.25],
          [220.0, 329.63, 392.0, 493.88],
          [246.94, 329.63, 415.3, 587.33],
        ];
        const melody = [659.25, 587.33, 523.25, 493.88, 440.0, 523.25, 392.0, 493.88];
        function tone(freq, start, duration, gainValue, type = "triangle") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(gainValue, start + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
          osc.connect(gain).connect(master);
          osc.start(start);
          osc.stop(start + duration + 0.04);
        }
        function playBar() {
          const now = ctx.currentTime + 0.02;
          const chord = chords[bar % chords.length];
          chord.forEach((freq, index) => tone(freq, now + index * 0.035, 1.35, 0.06));
          tone(chord[0] / 2, now, 0.42, 0.09, "sine");
          tone(chord[1] / 2, now + 0.58, 0.34, 0.055, "sine");
          tone(melody[bar % melody.length], now + 0.94, 0.46, 0.052, "sine");
          bar += 1;
        }
        return {
          async start() {
            await ctx.resume();
            clearInterval(timer);
            tone(783.99, ctx.currentTime + 0.01, 0.16, 0.08, "sine");
            tone(987.77, ctx.currentTime + 0.13, 0.22, 0.065, "sine");
            playBar();
            timer = setInterval(playBar, 1800);
          },
          stop() {
            clearInterval(timer);
          },
        };
      }

      async function toggleMusic() {
        if (musicOn) {
          audio?.stop();
          musicOn = false;
          musicBtn.classList.remove("playing");
          showToast("Music paused");
          return;
        }
        audio ||= createAmbience();
        if (!audio) {
          showToast("当前浏览器不支持音频");
          return;
        }
        await audio.start();
        musicOn = true;
        musicBtn.classList.add("playing");
        showToast("City night ambience");
      }

      renderTabs();
      sync();

      prevBtn.addEventListener("click", () => goTo(current - 1));
      nextBtn.addEventListener("click", () => goTo(current + 1));
      musicBtn.addEventListener("click", toggleMusic);
      wishBtn.addEventListener("click", () => wishDialog.showModal?.());

      stage.addEventListener("pointerdown", (event) => {
        startX = event.clientX;
        startY = event.clientY;
        startedOnButton = Boolean(event.target.closest("button"));
      });

      stage.addEventListener("pointerup", (event) => {
        if (startedOnButton) return;
        const dx = event.clientX - startX;
        const dy = Math.abs(event.clientY - startY);
        if (Math.abs(dx) < 56 || dy > Math.abs(dx) * 0.8) return;
        goTo(current + (dx < 0 ? 1 : -1));
      });

      document.querySelectorAll(".pin").forEach((pin) => {
        pin.addEventListener("click", (event) => {
          event.stopPropagation();
          noteTitle.textContent = labels[current];
          noteText.textContent = pin.dataset.note;
          noteDialog.showModal?.();
        });
      });

      document.querySelectorAll("[data-stamp]").forEach((button) => {
        button.addEventListener("click", () => {
          const stamp = button.dataset.stamp;
          collected.add(stamp);
          saveStamps();
          showToast(collected.size === validStamps.size ? "Love sketchbook completed" : "Stamp collected");
        });
      });

      saveWish.addEventListener("click", () => {
        const text = wishText.value.trim();
        if (!text) {
          showToast("先写一句想留住的话");
          return;
        }
        wishes[String(current)] = text;
        localStorage.setItem("ae-sketch-wishes", JSON.stringify(wishes));
        sync();
        showToast("Note pinned");
      });
    </script>
